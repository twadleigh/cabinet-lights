; PlatformIO Project Configuration for Raspberry Pi Pico 2 W (RP2350)
[platformio]
default_envs = pico2w-ota

[env]
; Use the community RP2040/RP2350 platform with Earle Philhower's core
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1m
extra_scripts = pre:scripts/build_flags.py

; Serial monitor config
monitor_speed = 115200

; Compiler flags: C++17, ARM Cortex-M33 floating point / DSP optimizations
build_flags =
    -D ARDUINO_RASPBERRY_PI_PICO_2_W
    -O2
    -Wall
; Fail on any enabled warning in our own translation units.
build_src_flags = -Werror

; ---------------------------------------------------------------------------
; Environment 1: Initial Bring-Up via USB (picotool bootloader)
; ---------------------------------------------------------------------------
[env:pico2w-usb]
upload_protocol = picotool

; ---------------------------------------------------------------------------
; Environment 2: Over-The-Air Flashing (Wi-Fi ArduinoOTA on port 2040)
; Auto-discovers IP via mDNS (cabinet-lights.local) or UDP broadcast (:44444)
; ---------------------------------------------------------------------------
[env:pico2w-ota]
upload_protocol = espota
upload_port = cabinet-lights.local
custom_ota_hostname = cabinet-lights
custom_udp_telemetry_port = 44444
extra_scripts = ${env.extra_scripts}, pre:scripts/ota_discover.py
