; PlatformIO Project Configuration for Raspberry Pi Pico 2 W (RP2350)
[platformio]
default_envs = pico2w-usb

[env]
; Use the community RP2040/RP2350 platform with Earle Philhower's core
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower

; Serial monitor config
monitor_speed = 115200

; Compiler flags: C++17, ARM Cortex-M33 floating point / DSP optimizations
build_flags =
    -D ARDUINO_RASPBERRY_PI_PICO_2_W
    -O2
    -Wall

; ---------------------------------------------------------------------------
; Environment 1: Initial Bring-Up via USB (picotool bootloader)
; ---------------------------------------------------------------------------
[env:pico2w-usb]
upload_protocol = picotool

; ---------------------------------------------------------------------------
; Environment 2: Future Over-The-Air Flashing (Uncomment once Wi-Fi is live)
; ---------------------------------------------------------------------------
; [env:pico2w-ota]
; upload_protocol = espota
; upload_port = cabinet-lights.local
; upload_flags =
;     --port=8266